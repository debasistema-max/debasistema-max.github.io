name: Sincronizar catálogo

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identificador seguro da solicitação
        required: false
        type: string
      photos_only:
        description: Carga inicial somente das fotos
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: debaportal-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Processar solicitação
        if: ${{ inputs.photos_only != true }}
        run: node scripts/sync-onedrive-remote.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_JOB_ID: ${{ inputs.job_id }}
          PRODUCT_CATALOG_API_URL: ${{ secrets.PRODUCT_CATALOG_API_URL }}
          PRODUCT_IMAGE_ORIGIN: ${{ secrets.PRODUCT_IMAGE_ORIGIN }}

      - name: Sincronizar fotos iniciais
        if: ${{ inputs.photos_only == true }}
        run: node scripts/sync-photos-remote.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_JOB_ID: ${{ inputs.job_id }}
          PRODUCT_CATALOG_API_URL: ${{ secrets.PRODUCT_CATALOG_API_URL }}
          PRODUCT_IMAGE_ORIGIN: ${{ secrets.PRODUCT_IMAGE_ORIGIN }}
